apiVersion: v1
kind: ConfigMap
metadata:
  name: shadowcast-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  shadowcast-overview.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Primary vs Shadow Request Rate (RPS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=\"order-service\"}[1m]))",
              "legendFormat": "Primary (order-service)",
              "refId": "A"
            },
            {
              "expr": "sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=\"shadow-service\"}[1m]))",
              "legendFormat": "Shadow (shadow-service)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "reqps"
            }
          }
        },
        {
          "title": "Mirroring Ratio Efficiency",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=\"shadow-service\"}[2m])) / sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=\"order-service\"}[2m]))",
              "legendFormat": "Ratio",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "green", "value": 0.95 }
                ]
              }
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "title": "ShadowCast Traffic Mirroring Overview",
      "uid": "shadowcast-overview"
    }