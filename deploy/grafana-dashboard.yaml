apiVersion: v1
kind: ConfigMap
metadata:
  name: shadowcast-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  shadowcast-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Shadow Traffic Ratio (Target: 0.50)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=\"shadow-service\"}[2m])) / sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=\"order-service\"}[2m]))",
              "legendFormat": "Actual Ratio",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.4 },
                  { "color": "green", "value": 0.48 },
                  { "color": "yellow", "value": 0.55 },
                  { "color": "red", "value": 0.65 }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          }
        },
        {
          "title": "Upstream Request Rate (RPS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 16, "x": 8, "y": 0 },
          "id": 2,
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=\"order-service\"}[1m]))",
              "legendFormat": "order-service (Primary)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=\"shadow-service\"}[1m]))",
              "legendFormat": "shadow-service (Shadow)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "reqps"
            }
          }
        },
        {
          "title": "Upstream HTTP 5xx Errors",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class=\"5\"}[1m])) by (envoy_cluster_name)",
              "legendFormat": "{{envoy_cluster_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "title": "Envoy Downstream Active Connections",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "envoy_http_downstream_cx_active{envoy_http_conn_manager_prefix=\"ingress_http\"}",
              "legendFormat": "Active Connections",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none" }
          }
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["shadowcast", "envoy", "kubernetes"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "ShadowCast - Envoy Traffic Mirroring",
      "uid": "shadowcast-traffic-mirroring"
    }