[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcast-cli"
version = "1.0.0"
description = "ShadowCast DevOps CLI for Zero-Risk Traffic Shadowing & Telemetry"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.5",
    "rich>=13.9.0",
    "httpx>=0.27.2",
    "tomli-w>=1.0.0",
]

[project.scripts]
shadowcast = "shadowcast_cli.main:app"
