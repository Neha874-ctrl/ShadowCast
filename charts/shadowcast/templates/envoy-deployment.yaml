apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-proxy
  namespace: default
  labels:
    app: envoy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9901"
        prometheus.io/path: "/stats/prometheus"
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.28.0
        args:
        - "-c"
        - "/etc/envoy/envoy.yaml"
        ports:
        - name: http-ingress
          containerPort: 10001
        - name: admin-metrics
          containerPort: 9901
        volumeMounts:
        - name: envoy-config-val
          mountPath: /etc/envoy
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /stats/prometheus
            port: 9901
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: envoy-config-val
        configMap:
          name: envoy-config
          items:
          - key: envoy-bootstrap.yaml
            path: envoy.yaml