---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - traffic.shadowcast.io
  resources:
  - shadowpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - traffic.shadowcast.io
  resources:
  - shadowpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - traffic.shadowcast.io
  resources:
  - shadowpolicies/status
  verbs:
  - get
  - patch
  - update
