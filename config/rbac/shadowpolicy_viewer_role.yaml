# This rule is not used by the project shadowcast itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to traffic.shadowcast.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shadowcast
    app.kubernetes.io/managed-by: kustomize
  name: shadowpolicy-viewer-role
rules:
- apiGroups:
  - traffic.shadowcast.io
  resources:
  - shadowpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - traffic.shadowcast.io
  resources:
  - shadowpolicies/status
  verbs:
  - get
