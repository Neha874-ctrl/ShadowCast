apiVersion: v1
kind: Service
metadata:
  name: envoy-service
spec:
  type: ClusterIP # Use NodePort or LoadBalancer if accessing from outside KinD
  selector:
    app: envoy
  ports:
    - name: http
      protocol: TCP
      port: 10000
      targetPort: 10000
    - name: admin
      protocol: TCP
      port: 9901
      targetPort: 9901