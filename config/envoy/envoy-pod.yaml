apiVersion: v1
kind: Pod
metadata:
  name: envoy-proxy
  labels:
    app: envoy
spec:
  containers:
    - name: envoy
      image: envoyproxy/envoy:v1.28.0
      ports:
        - containerPort: 10000
        - containerPort: 9901
      volumeMounts:
        - name: envoy-config-volume
          mountPath: /etc/envoy/
  volumes:
    - name: envoy-config-volume
      configMap:
        name: envoy-config
        items:
          - key: envoy-bootstrap.yaml
            path: envoy.yaml